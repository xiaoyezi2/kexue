<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>每日新诗 · Random Poem</title>
<style>
  * {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", serif;
  }
  body {
    background: #f7f9fc;
    color: #2d3436;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 20px;
  }
  .box {
    max-width: 600px;
    background: white;
    padding: 40px;
    border-radius: 16px;
    box-shadow: 0 8px 30px rgba(0,0,0,0.06);
  }
  h1 {
    font-size: 24px;
    margin-bottom: 20px;
    color: #3c6382;
  }
  .poem {
    font-size: 18px;
    line-height: 2;
    white-space: pre-line;
    color: #4b6584;
  }
  .author {
    margin-top: 20px;
    font-size: 16px;
    color: #777;
    text-align: right;
  }
</style>
</head>
<body>

<div class="box">
  <h1>今日新诗</h1>
  <div class="poem" id="poem"></div>
  <div class="author" id="author"></div>
</div>

<script>
  // 每次打开随机一首新诗
  const poems = [
    {
      text: "春风不解意\n吹落桃花三两枝\n我看青山多妩媚\n青山见我应如是",
      author: "佚名"
    },
    {
      text: "月光洒在窗前\n心事轻如燕\n一步一安然\n一程一相见",
      author: "现代小诗"
    },
    {
      text: "人间烟火气\n最抚凡人心\n三餐四季暖\n岁岁皆安身",
      author: "民间俗语"
    },
    {
      text: "山高自有行路\n水深自有渡船\n莫问前程几许\n抬头皆是温柔",
      author: "随心"
    },
    {
      text: "风来听风雨来听雨\n人生百味随意就好\n深话浅说\n长路慢走",
      author: "随笔"
    },
    {
      text: "岁月从不言语\n却回答所有问题\n时光不言不语\n悄悄抚平所有痕迹",
      author: "静思"
    }
  ];

  const random = poems[Math.floor(Math.random() * poems.length)];
  document.getElementById("poem").innerText = random.text;
  document.getElementById("author").innerText = "—— " + random.author;
</script>

</body>
</html>
